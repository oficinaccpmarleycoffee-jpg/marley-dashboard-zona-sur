name: Probar descarga Dashboard Marley

on:
  workflow_dispatch:

jobs:
  probar-json:
    runs-on: ubuntu-latest

    steps:
      - name: Probar acceso al JSON de OneDrive
        shell: bash
        run: |
          URL="https://marleycoffee-my.sharepoint.com/:u:/g/personal/fabian_bustos_marleycoffee_cl/IQCeXsdTeB7zT6OMxm8iAaB0ARTbwRFbxg7zEv7WfjMnah0?e=h0FWAk"

          curl -L "$URL" -o respuesta.txt

          echo "Tamaño descargado:"
          wc -c respuesta.txt

          echo "Tipo detectado:"
          file respuesta.txt

          echo "Contenido recibido:"
          cat respuesta.txt
          echo ""

          if grep -q "actualizadoUTC" respuesta.txt; then
            echo "OK: GitHub puede leer el JSON."
          else
            echo "ERROR: el enlace no entregó directamente dashboard-data.json."
            exit 1
          fi
